site_name: Oly Firmware Notes and Mods
site_description: How Olympus and OM System cameras work inside. Deepest on the E-M5
  Mark III.
use_directory_urls: false
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.top
  - navigation.indexes
  - search.highlight
  - content.code.copy
  - toc.follow
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: blue grey
    accent: teal
    toggle:
      icon: material/weather-night
      name: Dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue grey
    accent: teal
    toggle:
      icon: material/weather-sunny
      name: Light mode
markdown_extensions:
- tables
- toc:
    permalink: true
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- md_in_html
- attr_list
plugins:
- search
